line-length = 100
target-version = "py311"
exclude = [".venv", "templates", "static"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # длину строк держим форматтером, а не падением CI
    "B008",    # вызовы в аргументах по умолчанию — идиома aiogram/FastAPI
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
